<!DOCTYPE html>
<html lang="en-us">
<head>
    
<!-- Fullscreen is controlled by the GameHub player. -->

    <link rel="icon" type="image/png" href="favicon.ico">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>20 Minutes Till Dawn</title>
    
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #111;
            color: #fff;
            font-family: sans-serif;
        }
        #unity-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #000;
        }
        #unity-canvas {
            width: 100%;
            height: 100%;
            background: #000;
        }
        #loading-ui {
            position: absolute;
            text-align: center;
            width: 300px;
            z-index: 10;
        }
        #bar-container {
            width: 100%;
            height: 6px;
            background: #333;
            margin-top: 10px;
            border-radius: 3px;
        }
        #bar-fill {
            width: 0%;
            height: 100%;
            background: #eee;
            border-radius: 3px;
            transition: width 0.1s;
        }
        #status-text {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
    


  <link rel="stylesheet" href="../gamehub-loading-theme.css">
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
        <div id="loading-ui" class="gamehub-loading" data-loading-style="dawn" style="--gamehub-load-accent: #9ae66e;">
            <div id="status-text">loading data</div>
            <div id="bar-container"><div id="bar-fill"></div></div>
            <div id="progress-detail">0.00 MB / 54.98 MB</div>
        </div>
    </div>
    <script>
        let loadedBytes = 0;

        const statusText = document.querySelector("#status-text");
        const barFill = document.querySelector("#bar-fill");
        const progressDetail = document.querySelector("#progress-detail");
        const loadingUI = document.querySelector("#loading-ui");
        const TOTAL_PAYLOAD_BYTES = 57650104;
        const totalSize = TOTAL_PAYLOAD_BYTES / (1024 * 1024);

        async function fetchWithProgress(url) {
            const response = await fetch(url);
            const reader = response.body.getReader();
            let chunks = [];
            let received = 0;
            const contentLength = response.headers.get('Content-Length');
            const total = contentLength ? parseInt(contentLength, 10) : totalSize * 1024 * 1024;

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                received += value.length;
                loadedBytes += value.length;
                chunks.push(value);
                
                let mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
                statusText.textContent = "Downloading game files";
                progressDetail.textContent = `${mbDone} MB / ${totalSize.toFixed(2)} MB`;
                barFill.style.width = Math.min(100, (loadedBytes / TOTAL_PAYLOAD_BYTES) * 100) + "%";
            }
            let fullBuffer = new Uint8Array(received);
            let offset = 0;
            for (let chunk of chunks) {
                fullBuffer.set(chunk, offset);
                offset += chunk.length;
            }
            return fullBuffer.buffer;
        }

        async function mergeFiles(fileParts) {
            const buffers = await Promise.all(
                fileParts.map(part => fetchWithProgress(part))
            );
            const mergedBlob = new Blob(buffers);
            return URL.createObjectURL(mergedBlob);
        }

        function getParts(file, count) {
            let parts = [];
            for (let i = 1; i <= count; i++) {
                parts.push(file + ".part" + i);
            }
            return parts;
        }

        const canvas = document.querySelector("#unity-canvas");

        (async () => {
            const [dataUrl, wasmUrl] = await Promise.all([
                mergeFiles(getParts("Build/20minutes.data", 2)),
                mergeFiles(getParts("Build/20minutes.wasm", 2)),
            ]);
            var buildUrl = "Build";
            var loaderUrl = buildUrl + "/20minutes.loader.js";
            var config = {
                dataUrl: dataUrl,
                frameworkUrl: "Build/20minutes.framework.js",
                codeUrl: wasmUrl,
                streamingAssetsUrl: "StreamingAssets",
                companyName: "DefaultCompany",
                productName: "20 Minutes Till Dawn",
                productVersion: "1.0",
            };
            var container = document.querySelector("#unity-container");
            if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                container.className = "unity-mobile";
                config.devicePixelRatio = 1;
            } else {
                function resizeCanvas() {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                    canvas.style.width = window.innerWidth + "px";
                    canvas.style.height = window.innerHeight + "px";
                }
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);
            }
            var script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                createUnityInstance(canvas, config, (progress) => {
                    barFill.style.width = (100 * progress) + "%";
                    statusText.textContent = "Starting game";
                    progressDetail.textContent = `${totalSize.toFixed(2)} MB / ${totalSize.toFixed(2)} MB`;
                }).then((unityInstance) => {
                    loadingUI.style.display = "none";
                }).catch((message) => {
                    alert(message);
                });
            };
            script.onerror = () => {
                statusText.textContent = "Failed to load the game loader.";
                console.error("Could not load:", loaderUrl);
            };
            document.body.appendChild(script);
        })();
    </script>
</body>
</html>
