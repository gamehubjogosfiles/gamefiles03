<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Terraria port for WebAssembly. Play Terraria online in the browser.">
  <title>Terraria</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="../gamehub-loading-theme.css">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    body { position: relative; }
    #canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; border: 0; background: #000; image-rendering: pixelated; }
    #loading-progress { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 20px; background: #000; }
    #loading-ui { width: min(360px, 84vw); }
  </style>
</head>
<body>
  <div id="loading-progress" role="status" aria-live="polite">
    <div id="loading-ui" class="gamehub-loading" data-loading-style="scanner" style="--gamehub-load-accent: #e6c15a;">
      <div id="loading-text">Loading game files</div>
      <div id="bar-container"><div id="bar-fill"></div></div>
      <div id="progress-detail">Preparing Terraria...</div>
    </div>
  </div>
  <canvas id="canvas" aria-label="Terraria game"></canvas>
  <script>
    window.addEventListener('error', function () {
      var text = document.getElementById('loading-text');
      if (text) text.textContent = 'Unable to load game files.';
    });
  </script>
  <script type="module" crossorigin src="main.js"></script>
</body>
</html>
