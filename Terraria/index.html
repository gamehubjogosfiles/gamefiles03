<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Terraria port for WebAssembly. Play Terraria online in the browser.">
  <title>Terraria</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #000; overflow: hidden; }
    body { position: relative; }
    #app, canvas, iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    canvas { display: block; max-width: 100vw; max-height: 100vh; margin: auto; }
    #gamehub-loader {
      position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
      gap: 14px; align-content: center; color: #fff; background: #000;
      font: 700 16px/1.3 Arial, sans-serif; text-align: center;
    }
    #gamehub-loader.is-hidden { display: none; }
    #gamehub-spinner {
      width: 34px; height: 34px; border: 4px solid #444; border-top-color: #fff;
      border-radius: 50%; animation: gamehub-spin .8s linear infinite;
    }
    @keyframes gamehub-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app"></div>
  <canvas id="canvas" aria-label="Terraria game"></canvas>
  <div id="gamehub-loader" role="status" aria-live="polite">
    <div id="gamehub-spinner" aria-hidden="true"></div>
    <div>Loading...</div>
  </div>
  <script type="module" crossorigin src="main.js"></script>
  <script>
    (function () {
      var loader = document.getElementById('gamehub-loader');
      var canvas = document.getElementById('canvas');
      var startedAt = Date.now();
      function checkReady() {
        if (canvas && canvas.width > 32 && canvas.height > 32 && Date.now() - startedAt > 900) {
          loader.classList.add('is-hidden');
          return;
        }
        window.setTimeout(checkReady, 250);
      }
      window.setTimeout(checkReady, 250);
    }());
  </script>
</body>
</html>
