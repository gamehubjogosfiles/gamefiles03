<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Terraria port for WebAssembly. Play Terraria online in the browser.">
  <title>Terraria</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    body { position: relative; }
    #canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; border: 0; background: #000; image-rendering: pixelated; }
    #loading-progress { position: fixed; top: 50%; left: 50%; z-index: 10; width: min(360px, 84vw); padding: 20px; transform: translate(-50%, -50%); color: #fff; background: #000; border: 1px solid #fff; font: 700 16px/1.4 Arial, sans-serif; text-align: center; }
    #loading-text { min-height: 22px; }
    #loading-progress::after { display: block; width: 34px; height: 34px; margin: 16px auto 0; border: 4px solid #444; border-top-color: #fff; border-radius: 50%; content: ""; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading-progress" role="status" aria-live="polite"><div id="loading-text">Loading...</div></div>
  <canvas id="canvas" aria-label="Terraria game"></canvas>
  <script>
    window.addEventListener('error', function () {
      var text = document.getElementById('loading-text');
      if (text) text.textContent = 'Unable to load game files.';
    });
  </script>
  <script type="module" crossorigin src="main.js"></script>
</body>
</html>
