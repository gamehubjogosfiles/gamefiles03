<!DOCTYPE html>
<html lang="en-us">
<head>
    
<!-- Fullscreen is controlled by the GameHub player. -->

    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bad Piggies</title>
    
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }
        body::before, body::after {
            display: none !important;
        }
        .webgl-content {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            transform: none !important;
        }
        #gameContainer {
            width: 100vw !important;
            height: 100vh !important;
        }
    </style>
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
    


<!-- Fullscreen is controlled by the GameHub player. -->


<style id="gamehub-touch-style">
  html, body, canvas, img, a, button, input, select, textarea, div {
    -webkit-tap-highlight-color: transparent !important;
    -webkit-touch-callout: none !important;
    -webkit-user-select: none !important;
    user-select: none !important;
  }
  *, *::before, *::after { -webkit-tap-highlight-color: transparent !important; }
  ::selection { background: transparent !important; color: inherit !important; }
  :focus, :focus-visible, canvas:active, canvas:focus { outline: none !important; box-shadow: none !important; }
</style>
</head>
<body>
    <div class="webgl-content">
        <div id="gameContainer"></div>
    </div>
    <script>
        window.addEventListener("load", function () {
            if (typeof UnityLoader === "undefined") {
                console.error("UnityLoader failed to load.");
                return;
            }

            window.gameInstance = UnityLoader.instantiate(
                "gameContainer",
                "Build/Bad Piggies.json",
                { onProgress: UnityProgress }
            );
        });
    </script>
</body>
</html>
