<style id="gamehub-touch-style">
  html, body, body * { -webkit-tap-highlight-color: rgba(0,0,0,0) !important; }
  html, body, canvas { -webkit-touch-callout: none !important; touch-action: manipulation; }
  html, body, canvas, img, a, button, iframe, [role="button"] { -webkit-user-select: none !important; user-select: none !important; }
  input, textarea, select, [contenteditable="true"] { -webkit-user-select: text !important; user-select: text !important; }
  *, *::before, *::after { outline: 0 !important; -webkit-focus-ring-color: transparent !important; }
  *:focus, *:focus-visible, canvas:active, canvas:focus { outline: 0 !important; box-shadow: none !important; }
  ::selection { background: transparent !important; color: inherit !important; }
</style>
</head>
<body>
    <div id="content"></div>
    <div id="orientation"></div>
    <div id="loader">Loading ...</div>
<script id="gamehub-touch-behavior">
(() => {
  const clearTransientTouchState = () => {
    if (window.getSelection) window.getSelection().removeAllRanges();
    const active = document.activeElement;
    if (active && active !== document.body && !/^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)) active.blur();
  };
  document.addEventListener('pointerup', clearTransientTouchState, { capture: true, passive: true });
  document.addEventListener('touchend', clearTransientTouchState, { capture: true, passive: true });
})();
</script></body>
<script>
    var useEvents = (typeof(Event) === 'function');

    var myDispatchEvent = function (name){
        var event;
        if (useEvents){
            event =  new Event(name);
        }else{
            event = document.createEvent('Event');
            event.initEvent(name, true, true);
        }
        document.getElementById("content").dispatchEvent(event);
    }
    var nape = "nape.mi.js";

    window.famobi_onPauseRequested = function(){
        // code that pauses/mutes the game
        console.log('ad started');
        myDispatchEvent('SDK_GAME_PAUSE');
    };

    window.famobi_onResumeRequested = function(){
        // code that unpauses/unmutes the game
        console.log('ad resumed');
        myDispatchEvent('SDK_GAME_START');
    };

    window.famobi_gameID = 'moto-x3m'; // the actual GAMEID is added to the final version by Famobi
    window.famobi_gameJS = ['js/all.js',
        function() {
            // start the game
            window.famobi_started = true;
            myDispatchEvent('start_game');
        }
    ];
    (function (document, url, fgJS, firstJS) {
        fgJS = document.createElement('script');
        firstJS = document.getElementsByTagName('script')[0];
        fgJS.src = url + encodeURIComponent(document.location.href);
        firstJS.parentNode.insertBefore(fgJS, firstJS);
        })(document, 'js/start.js?e=');
</script>
