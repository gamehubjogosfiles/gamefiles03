<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>R.E.P.O.</title>
  <link rel="icon" href="favicon.ico">
  
<!-- Fullscreen is controlled by the GameHub player. -->

  <style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; color: #fff; font-family: Arial, sans-serif; }
#game-container { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
canvas { width: 100%; height: 100%; display: block; background: #000; outline: none; }
#loading-ui { position: absolute; z-index: 10; width: min(320px, 72vw); text-align: center; pointer-events: none; }
#status-text { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #f4f4f4; }
#bar-container { width: 100%; height: 6px; margin-top: 12px; overflow: hidden; border-radius: 4px; background: #343434; }
#bar-fill { width: 0%; height: 100%; border-radius: 4px; background: #ededed; transition: width 0.12s linear; }
#error-box { display: none; margin-top: 14px; color: #ff8d8d; font-size: 12px; line-height: 1.4; }
</style>
  <link rel="stylesheet" href="../gamehub-loading-theme.css?v=20260830-center">
  <script src="../gamehub-loading-theme.js"></script>

<style id="gamehub-touch-style">
  html, body, canvas, img, a, button, input, select, textarea, div {
    -webkit-tap-highlight-color: transparent !important;
    -webkit-touch-callout: none !important;
    -webkit-user-select: none !important;
    user-select: none !important;
  }
  *, *::before, *::after { -webkit-tap-highlight-color: transparent !important; }
  ::selection { background: transparent !important; color: inherit !important; }
  :focus, :focus-visible, canvas:active, canvas:focus { outline: none !important; box-shadow: none !important; }
</style>
</head>
<body>
  <div id="game-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading-ui" class="gamehub-loading" style="--gamehub-load-accent: #ffd400;"><div id="status-text">Loading game...</div><div id="bar-container"><div id="bar-fill"></div></div><div id="error-box"></div></div>
  </div>
  <script>
const canvas = document.querySelector('#unity-canvas');
const loadingUI = document.querySelector('#loading-ui');
const statusText = document.querySelector('#status-text');
const barFill = document.querySelector('#bar-fill');
const errorBox = document.querySelector('#error-box');
let loadedBytes = 0;
let expectedBytes = 0;

function formatMB(bytes) {
  return (bytes / (1024 * 1024)).toFixed(2);
}
function updateDownloadStatus() {
  const progress = expectedBytes > 0 ? Math.min(100, (loadedBytes / expectedBytes) * 100) : 0;
  barFill.style.width = progress + '%';
  statusText.textContent = expectedBytes > 0
    ? `loading... ${formatMB(loadedBytes)} MB / ${formatMB(expectedBytes)} MB`
    : `loading... ${formatMB(loadedBytes)} MB`;
}
async function fetchWithProgress(url) {
  const response = await fetch(url);
  if (!response.ok || !response.body) throw new Error(`Unable to load ${url} (${response.status})`);
  const length = Number(response.headers.get('content-length')) || 0;
  expectedBytes += length;
  updateDownloadStatus();
  const reader = response.body.getReader();
  const chunks = [];
  let received = 0;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.byteLength;
    loadedBytes += value.byteLength;
    updateDownloadStatus();
  }
  const output = new Uint8Array(received);
  let offset = 0;
  for (const chunk of chunks) { output.set(chunk, offset); offset += chunk.byteLength; }
  return output.buffer;
}
async function mergeFiles(parts) {
  const buffers = await Promise.all(parts.map(fetchWithProgress));
  return URL.createObjectURL(new Blob(buffers));
}
function partNames(file, count, padding) {
  return Array.from({ length: count }, (_, index) => {
    const number = String(index + 1).padStart(padding, '0');
    return `${file}.part${number}`;
  });
}
function showError(error) {
  console.error(error);
  statusText.textContent = 'loading failed';
  errorBox.textContent = error && error.message ? error.message : String(error);
  errorBox.style.display = 'block';
}
async function bootUnity(options) {
  try {
    const [dataUrl, wasmUrl] = await Promise.all([
      mergeFiles(partNames(options.dataFile, options.dataParts, options.padding || 0)),
      mergeFiles(partNames(options.wasmFile, options.wasmParts, options.padding || 0)),
    ]);
    const config = {
      dataUrl,
      frameworkUrl: options.frameworkUrl,
      codeUrl: wasmUrl,
      streamingAssetsUrl: 'StreamingAssets',
      companyName: options.companyName,
      productName: options.productName,
      productVersion: options.productVersion,
    };
    if (/iPhone|iPad|iPod|Android|Mobile|Tablet/i.test(navigator.userAgent)) {
      config.devicePixelRatio = 1;
    } else {
      const resize = () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
      };
      resize();
      window.addEventListener('resize', resize);
    }
    statusText.textContent = 'starting game';
    barFill.style.width = '100%';
    const script = document.createElement('script');
    script.src = options.loaderUrl;
    script.onload = () => createUnityInstance(canvas, config, (progress) => {
      barFill.style.width = (100 * progress) + '%';
      statusText.textContent = 'starting game';
    }).then(() => { loadingUI.style.display = 'none'; }).catch(showError);
    script.onerror = () => showError(new Error(`Unable to load ${options.loaderUrl}`));
    document.body.appendChild(script);
  } catch (error) {
    showError(error);
  }
}
</script>
  <script>
bootUnity({
  dataFile: 'Build/NewestBuild.data.gz',
  dataParts: 16,
  wasmFile: 'Build/NewestBuild.wasm.gz',
  wasmParts: 3,
  padding: 0,
  frameworkUrl: 'Build/NewestBuild.framework.js.gz',
  loaderUrl: 'Build/NewestBuild.loader.js',
  companyName: 'Stupid Game',
  productName: 'R.E.P.O.',
  productVersion: '0.1',
});
</script>
</body>
</html>
