<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <link rel="icon" href="favicon.ico">
  <title>The Visitor</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}body{display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif}#player{width:100%;height:100%}#player ruffle-player{width:100%;height:100%}#loading{position:fixed;inset:0;z-index:5;display:grid;place-content:center;justify-items:center;gap:12px;background:#000;color:#fff;text-align:center;pointer-events:none}#loading.hidden{display:none}#spinner{width:36px;height:36px;border:3px solid #333;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}#text{font-size:15px;font-weight:700}#detail{min-height:18px;color:#aaa;font-size:13px}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <script>window.RufflePlayer=window.RufflePlayer||{};window.RufflePlayer.config={...(window.RufflePlayer.config||{}),contextMenu:'off'};</script>
  <script src="ruffle.js"></script>
</head>
<body>
  <div id="loading" role="status"><div id="spinner"></div><div id="text">Loading game</div><div id="detail">0%</div></div>
  <div id="player"></div>
  <script>
    window.addEventListener('load',function(){
      const loading=document.getElementById('loading');
      const detail=document.getElementById('detail');
      const ruffle=window.RufflePlayer&&window.RufflePlayer.newest&&window.RufflePlayer.newest();
      if(!ruffle){document.getElementById('text').textContent='Unable to load Flash player';return;}
      const player=ruffle.createPlayer();
      player.style.width='100%'; player.style.height='100%';
      document.getElementById('player').appendChild(player);
      player.addEventListener('loadedmetadata',function(){detail.textContent='100%';setTimeout(function(){loading.classList.add('hidden')},180)});
      player.load('the-visitor.swf').catch(function(){document.getElementById('text').textContent='Unable to load game'});
      setTimeout(function(){detail.textContent='Loading...'},500);
    });
  </script>
</body>
</html>
