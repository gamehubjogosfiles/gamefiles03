<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Sonic Mania</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="card.png">
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0;
      overflow: hidden; background: #000; color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }
    canvas#canvas {
      position: fixed; left: 50%; top: 50%; z-index: 0;
      width: min(100vw, 176.66667dvh) !important;
      height: min(100dvh, 56.60377vw) !important;
      max-width: 100vw; max-height: 100vh; max-height: 100dvh;
      margin: 0; padding: 0; border: 0; outline: none;
      transform: translate(-50%, -50%);
      background: #000; image-rendering: pixelated;
      visibility: hidden; opacity: 0;
      transition: opacity 300ms ease;
    }
    canvas#canvas.visible { visibility: visible; opacity: 1; }
    #loading-screen {
      position: fixed; inset: 0; z-index: 10;
      display: grid; place-items: center; overflow: hidden;
      background: #080b13; opacity: 1;
      transition: opacity 300ms ease;
    }
    #loading-screen::before {
      content: ""; position: absolute; inset: -24px;
      background: url("card.png") center / cover no-repeat;
      filter: blur(22px) brightness(.25) saturate(.85);
      transform: scale(1.08);
    }
    #loading-screen::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(125deg, rgba(2,9,25,.52), rgba(0,0,0,.76));
    }
    #loading-screen.fade-out { opacity: 0; pointer-events: none; }
    #loading-screen.hidden { display: none; }
    .loading-panel {
      position: relative; z-index: 1; width: min(88vw, 560px);
      padding: 22px; border: 1px solid rgba(255,255,255,.24);
      border-radius: 14px; background: rgba(5,8,14,.78);
      box-shadow: 0 16px 48px rgba(0,0,0,.42); backdrop-filter: blur(8px);
    }
    .loading-heading { display: flex; align-items: center; gap: 13px; margin-bottom: 22px; }
    .loading-icon { width: 50px; height: 50px; object-fit: cover; border-radius: 9px; }
    .eyebrow { color: #9fc8ff; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 3px 0 0; font-size: clamp(20px, 5vw, 28px); line-height: 1.05; }
    .progress-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    #loading-message { font-size: 14px; font-weight: 700; }
    #loading-percent { font-size: 13px; font-variant-numeric: tabular-nums; color: #dbeaff; }
    .progress-track { width: 100%; height: 11px; margin: 10px 0 8px; overflow: hidden; border-radius: 20px; background: rgba(255,255,255,.18); }
    #loading-bar { width: 0%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #2a8fff, #8dd8ff); transition: width 120ms linear; }
    .loading-meta { display: flex; justify-content: space-between; gap: 12px; color: rgba(255,255,255,.76); font-size: 12px; font-variant-numeric: tabular-nums; }
    #loading-error { display: none; margin: 15px 0 0; padding: 10px 12px; border-radius: 8px; color: #ffd6d6; background: rgba(145,20,20,.35); font-size: 13px; line-height: 1.4; overflow-wrap: anywhere; }
    #loading-screen.has-error #loading-error { display: block; }
    .credits { margin: 18px 0 0; color: rgba(255,255,255,.65); font-size: 11px; line-height: 1.4; }
    #output { display: none; }
    @media (max-width: 520px) { .loading-panel { padding: 18px; } .loading-icon { width: 42px; height: 42px; } }
  </style>
</head>
<body>
  <canvas id="canvas" width="424" height="240" tabindex="-1" onclick="this.focus();" oncontextmenu="event.preventDefault();"></canvas>
  <textarea id="output" rows="8" aria-hidden="true"></textarea>

  <div id="loading-screen" role="status" aria-live="polite">
    <section class="loading-panel">
      <div class="loading-heading">
        <img class="loading-icon" src="favicon.png" alt="Sonic Mania">
        <div><div class="eyebrow">GameHub · local game files</div><h1>Sonic Mania</h1></div>
      </div>
      <div class="progress-row"><span id="loading-message">Preparing game data…</span><span id="loading-percent">0%</span></div>
      <div class="progress-track" role="progressbar" aria-label="Sonic Mania game data download" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="loading-bar"></div></div>
      <div class="loading-meta"><span id="loading-size">0.0 / 198.7 MB</span><span id="loading-phase">14 local data chunks</span></div>
      <p id="loading-error"></p>
      <p class="credits">Browser port build credited to Crunch Arcade; source package: UGBONTOP/Sonic-Mania-InYourBrowser.</p>
    </section>
  </div>

  <script>
    var canvasElement = document.getElementById('canvas');
    var loadingScreen = document.getElementById('loading-screen');
    var loadingMessage = document.getElementById('loading-message');
    var loadingPercent = document.getElementById('loading-percent');
    var loadingBar = document.getElementById('loading-bar');
    var loadingSize = document.getElementById('loading-size');
    var loadingPhase = document.getElementById('loading-phase');
    var loadingError = document.getElementById('loading-error');
    var progressTrack = document.querySelector('.progress-track');
    var TOTAL_GAME_BYTES = 208368695;
    var fatalErrorShown = false;

    function reportGameHub(state, message) {
      if (!window.parent || window.parent === window) return;
      try { window.parent.postMessage({ gamehub: 'game-status', state: state, message: String(message || '') }, '*'); } catch (e) {}
    }
    function formatMB(bytes) { return (Math.max(0, Number(bytes) || 0) / 1048576).toFixed(1) + ' MB'; }
    function showProgress(loaded, total, label) {
      window.__sonicDataProgressStarted = true;
      total = Number(total) || TOTAL_GAME_BYTES;
      loaded = Math.max(0, Math.min(Number(loaded) || 0, total));
      var percent = Math.min(100, Math.floor(loaded * 100 / total));
      loadingBar.style.width = percent + '%';
      loadingPercent.textContent = percent + '%';
      loadingSize.textContent = formatMB(loaded) + ' / ' + formatMB(total);
      progressTrack.setAttribute('aria-valuenow', String(percent));
      if (label) loadingMessage.textContent = label;
      if (percent >= 100) loadingPhase.textContent = 'Starting the game';
      else loadingPhase.textContent = '14 local data chunks';
    }
    function focusGameCanvas() {
      try { canvasElement.focus({ preventScroll: true }); }
      catch (e) { canvasElement.focus(); }
    }
    function showFatalError(error) {
      if (fatalErrorShown) return;
      fatalErrorShown = true;
      var detail = error && error.message ? error.message : String(error || 'Unknown error');
      loadingScreen.classList.add('has-error');
      loadingMessage.textContent = 'Sonic Mania could not start';
      loadingPhase.textContent = 'Check the connection and reload';
      loadingError.textContent = detail;
      reportGameHub('error', 'Sonic Mania error: ' + detail);
      if (window.console && console.error) console.error('Sonic Mania runtime error:', error);
      if (typeof Module !== 'undefined' && Module) {
        Module.setStatus = function (text) { if (text) console.error('[post-error status]', text); };
      }
    }
    function finishLoading() {
      if (fatalErrorShown) return;
      loadingMessage.textContent = 'Starting Sonic Mania…';
      loadingPhase.textContent = 'Game data ready';
      canvasElement.classList.add('visible');
      focusGameCanvas();
      requestAnimationFrame(focusGameCanvas);
      window.setTimeout(function () {
        loadingScreen.classList.add('fade-out');
        loadingScreen.addEventListener('transitionend', function () {
          loadingScreen.classList.add('hidden');
        }, { once: true });
        window.setTimeout(function () { loadingScreen.classList.add('hidden'); }, 450);
      }, 250);
      reportGameHub('ready', '');
    }

    var Module = {
      preRun: [function () {
        try {
          FS.mkdir('/saves');
          FS.mount(IDBFS, {}, '/saves');
          FS.syncfs(true, function (error) {
            if (error) { console.warn('Could not load Sonic Mania saves from IndexedDB:', error); return; }
            try {
              if (FS.analyzePath('/saves/SaveData.bin').exists) {
                FS.writeFile('/SaveData.bin', FS.readFile('/saves/SaveData.bin'));
                console.log('Sonic Mania save data loaded from IndexedDB');
              }
            } catch (e) { console.log('No existing Sonic Mania save found:', e); }
          });
        } catch (error) { console.warn('Sonic Mania save storage unavailable; continuing without persisted saves:', error); }
      }],
      postRun: [function () {
        finishLoading();
        window.setInterval(function () {
          try {
            var data = FS.readFile('/SaveData.bin');
            FS.writeFile('/saves/SaveData.bin', data);
            FS.syncfs(false, function (error) { if (error) console.warn('Sonic Mania save sync failed:', error); });
          } catch (e) {}
        }, 5000);
      }],
      print: function (text) { console.log(text); },
      printErr: function (text) { console.error(text); },
      canvas: canvasElement,
      locateFile: function (path) {
        if (path && path.toLowerCase().endsWith('.wasm')) return new URL('RSDKv5U.wasm', document.baseURI).href;
        return new URL(path, document.baseURI).href;
      },
      gamehubProgress: showProgress,
      gamehubError: showFatalError,
      onRuntimeInitialized: function () { loadingMessage.textContent = 'Starting Sonic Mania…'; },
      onAbort: function (reason) { showFatalError('Runtime abort: ' + reason); },
      setStatus: function (text) {
        if (fatalErrorShown || !text) return;
        if (!window.__sonicDataProgressStarted) loadingMessage.textContent = String(text);
      },
      totalDependencies: 0,
      monitorRunDependencies: function (left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        if (!window.__sonicDataProgressStarted && left) loadingMessage.textContent = 'Preparing engine…';
      }
    };

    window.addEventListener('error', function (event) { showFatalError(event.error || event.message || 'Unknown runtime error'); });
    window.addEventListener('unhandledrejection', function (event) { showFatalError(event.reason || 'Unhandled runtime rejection'); });
    window.addEventListener('beforeunload', function () {
      try {
        var data = FS.readFile('/SaveData.bin');
        FS.writeFile('/saves/SaveData.bin', data);
        FS.syncfs(false, function () {});
      } catch (e) {}
    });
    canvasElement.addEventListener('pointerdown', focusGameCanvas);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js?v=sonic-local-v7').catch(function (error) {
        console.warn('Sonic Mania cache update skipped:', error);
      });
    }
  </script>
  <script src="Data.js?v=sonic-local-v7"></script>
  <script src="RSDKv5U.js?v=sonic-local-v7"></script>
</body>
</html>
