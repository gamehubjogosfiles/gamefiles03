<!DOCTYPE html>
<html lang="en">
<head>

	<meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

	<!--<script src="poki-sdk.js"></script>-->
	<script src="poki-sdk.js"></script>
	
	<script src="./Level Devil.js"></script>

	<script>
		window.addEventListener ("touchmove", function (event) { event.preventDefault (); }, { capture: false, passive: false });
		if (typeof window.devicePixelRatio != 'undefined' && window.devicePixelRatio > 2) {
			var meta = document.getElementById ("viewport");
			meta.setAttribute ('content', 'width=device-width, initial-scale=' + (2 / window.devicePixelRatio) + ', user-scalable=no');
		}
	</script>
	
	<style>
		html,body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
		#openfl-content { background: #000000; width: 100%; height: 100%; }
		#progress { position: relative; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 50%; }

	</style>
	









<style id="gamehub-touch-style">
  html, body, body * { -webkit-tap-highlight-color: rgba(0,0,0,0) !important; }
  html, body, canvas { -webkit-touch-callout: none !important; touch-action: manipulation; }
  html, body, canvas, img, a, button, iframe, [role="button"] { -webkit-user-select: none !important; user-select: none !important; }
  input, textarea, select, [contenteditable="true"] { -webkit-user-select: text !important; user-select: text !important; }
  *, *::before, *::after { outline: 0 !important; -webkit-focus-ring-color: transparent !important; }
  *:focus, *:focus-visible, canvas:active, canvas:focus { outline: 0 !important; box-shadow: none !important; }
  ::selection { background: transparent !important; color: inherit !important; }
</style>
</head>
<body>
	
	<noscript>This webpage makes extensive use of JavaScript. Please enable JavaScript in your web browser to view this page.</noscript>
	
	<div id="openfl-content"></div>
	
	<script>
		lime.embed ("Level Devil", "openfl-content", 854, 480, { parameters: {} });
	</script>
	
<script id="gamehub-touch-behavior">
(() => {
  const clearTransientTouchState = () => {
    if (window.getSelection) window.getSelection().removeAllRanges();
    const active = document.activeElement;
    if (active && active !== document.body && !/^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)) active.blur();
  };
  document.addEventListener('pointerup', clearTransientTouchState, { capture: true, passive: true });
  document.addEventListener('touchend', clearTransientTouchState, { capture: true, passive: true });
})();
</script></body>
</html>
