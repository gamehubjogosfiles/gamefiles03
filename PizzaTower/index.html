<!DOCTYPE html>
<html lang="en-us">

<head>
<script id="gamehub-mobile-fullscreen-first">(function(){'use strict';var mobile=window.matchMedia&&window.matchMedia('(max-width: 680px)').matches||/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);if(!mobile)return;function enter(){if(document.fullscreenElement)return;var root=document.documentElement,request=root.requestFullscreen||root.webkitRequestFullscreen||root.mozRequestFullScreen||root.msRequestFullScreen;if(request){try{var result=request.call(root,{navigationUI:'hide'});if(result&&result.catch)result.catch(function(){});}catch(e){}}}document.addEventListener('pointerdown',enter,{passive:true});document.addEventListener('touchstart',enter,{passive:true});})();</script>
<meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title>Pizza Tower 1.1.0 Web Port</title>
    <link rel="stylesheet" href="index.css">
<style id="gamehub-touch-style">
html,body,body *{-webkit-tap-highlight-color:rgba(0,0,0,0)!important}
html,body,canvas,img,a,button{-webkit-user-select:none!important;user-select:none!important;outline:0!important}
html,body{font-family:Arial,sans-serif;margin:0;padding:0;width:100%;height:100%;overflow:hidden;background-color:#000;text-align:center;touch-action:manipulation}
canvas.emscripten{height:100%;margin:auto;padding:0;border:0 none;background-color:#000}
.loading{position:fixed!important;inset:0!important;z-index:10;display:block!important;background:#000!important;pointer-events:none}
.loading>*{padding:0!important;margin:0!important}
.spinner{height:30px;width:30px;margin:0;position:fixed;top:calc(50% - 60px);left:calc(50% - 15px);z-index:5;-webkit-animation:rotation .8s linear infinite;animation:rotation .8s linear infinite;border-left:5px solid rgb(235,235,235);border-right:5px solid rgb(235,235,235);border-bottom:5px solid rgb(235,235,235);border-top:5px solid rgb(120,120,120);border-radius:100%;background-color:#000}
@keyframes rotation{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
#status{display:block;position:fixed;top:50%;left:50%;z-index:5;margin:0;transform:translateX(-50%);font-weight:bold;color:rgb(120,120,120)}
#progress{position:fixed;top:calc(50% + 34px);left:50%;z-index:5;transform:translateX(-50%);height:20px;width:min(300px,80vw)}
</style>
  <link rel="icon" type="image/png" href="card.png">
  <link rel="apple-touch-icon" href="card.png">
</head>

<body>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1">
    </canvas>
    <div id="pauseMenuContainer" hidden>
        <div id="pauseMenuBorder">
            <div id="pauseMenu">
                <button id="resumeButton" onclick="resume()"> Resume </button>
                <button id="quitButton" onclick="quitIfSupported()"> Quit </button>
            </div>
        </div>
    </div>
    <div class="loading">
        <div class="spinner" id="spinner"></div>
        <div class="emscripten" id="status">Downloading...</div>
        <progress value="0" max="100" id="progress"></progress>
    </div>
    <div class="output-container" id="output-container">
        <div id="message-container">
            <div id="messages">
            </div>
        </div>
        <script>
          function mergeFiles(fileParts) {
              return new Promise((resolve, reject) => {
                  let buffers = [];
      
                  function fetchPart(index) {
                      if (index >= fileParts.length) {
                          let mergedBlob = new Blob(buffers);
                          let mergedFileUrl = URL.createObjectURL(mergedBlob);
                          resolve(mergedFileUrl);
                          return;
                      }
                      fetch(fileParts[index]).then((response) => response.arrayBuffer()).then((data) => {
                          buffers.push(data);
                          fetchPart(index + 1);
                      }).catch(reject);
                  }
                  fetchPart(0);
              });
          }
      
          function getParts(file, start, end) {
              let parts = [];
              for (let i = start; i <= end; i++) {
                  parts.push(file + ".part" + i);
              }
              return parts;
          }
      
          mergeFiles(getParts("game.unx", 1, 13)).then(async url => {
              window.gameUnxUrl = url;
      
              const originalFetch = window.fetch;
              window.fetch = async function (...args) {
                  let [url, options] = args;
                  if (typeof url === 'string' && url.includes("game.unx")) {
                      console.log("fetch:", url);
                      url = window.gameUnxUrl;
                  } else if (url instanceof Request && url.url.includes("game.unx")) {
                      console.log("fetch request:", url.url);
                      url = new Request(window.gameUnxUrl, url);
                  }
                  return originalFetch.call(this, url, options);
              };
      
              const originalOpen = XMLHttpRequest.prototype.open;
              XMLHttpRequest.prototype.open = function (method, url, ...rest) {
                  if (url.includes("game.unx")) {
                      console.log("XHR:", url);
                      url = window.gameUnxUrl;
                  }
                  return originalOpen.call(this, method, url, ...rest);
              };
              let index = document.createElement("script");
              index.src = "index.js";
              document.body.appendChild(index);
      
              let runner = document.createElement("script");
              runner.src = "runner.js";
              document.body.appendChild(runner);
          }).catch(error => {
              console.error("Failed to merge files:", error);
          });
      </script>      
</body>

</html>
