    <base href="https://cdn.jsdelivr.net/gh/web-ports/slendytubbies@latest/2d/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Slendytubbies 2D</title>
    <style>

    <style id="gamehub-loading-theme">
      html, body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; background:#000; }
      #loading-ui { position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; background:#000; }
      #loading-panel { width:min(300px,84vw); color:#fff; text-align:center; font-family:Arial,sans-serif; }
      #status-text { font-size:14px; text-transform:uppercase; letter-spacing:1px; }
      #bar-container { width:100%; height:6px; margin-top:10px; background:#333; border-radius:3px; }
      #bar-fill { width:0%; height:100%; background:#eee; border-radius:3px; transition:width .15s ease; }
      #progress-detail { margin-top:8px; color:#aaa; font-size:12px; }
    </style>

  </head>
  <body>
<div id="loading-ui" role="status" aria-live="polite">
      <div id="loading-panel">
        <div id="status-text">Downloading game files</div>
        <div id="bar-container"><div id="bar-fill"></div></div>
        <div id="progress-detail">Preparing game files...</div>
      </div>
    </div>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <script type="text/javascript">
      var Module = {
        TOTAL_MEMORY: 1073741824,
        errorhandler: null,
        compatibilitycheck: null,
        dataUrl: "Release/Build.data",
        codeUrl: "Release/Build.js",
        memUrl: "Release/Build.mem"
      };
    </script>

    <script type="text/javascript">
      (async function () {
        const loadingText = document.getElementById("status-text");
        const TOTAL_MB = (16.96 + 19.9).toFixed(2);
        let loadedBytes = 0;

        async function fetchWithProgress(url) {
          const response = await fetch(url);
          if (!response.ok) throw new Error("Failed to fetch " + url + " (" + response.status + ")");
          const reader = response.body.getReader();
          const chunks = [];
          let received = 0;
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            received += value.length;
            loadedBytes += value.length;
            chunks.push(value);
            const mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
            loadingText.textContent = "Downloading game files"; document.getElementById("progress-detail").textContent = `${mbDone} MB / ${TOTAL_MB} MB`; document.getElementById("bar-fill").style.width = Math.min(100, (loadedBytes / (parseFloat(TOTAL_MB) * 1024 * 1024)) * 100) + "%";
          }
          const fullBuffer = new Uint8Array(received);
          let offset = 0;
          for (const chunk of chunks) {
            fullBuffer.set(chunk, offset);
            offset += chunk.length;
          }
          return fullBuffer.buffer;
        }

        async function mergeFiles(fileParts, cacheKey) {
          const cache = await caches.open("st2d-cache");
          const cachedResponse = await cache.match(cacheKey);
          if (cachedResponse) {
            const blob = await cachedResponse.blob();
            loadingText.textContent = "Loading cached files"; document.getElementById("progress-detail").textContent = `0 MB / ${TOTAL_MB} MB`;
            return URL.createObjectURL(blob);
          }
          const buffers = await Promise.all(fileParts.map(part => fetchWithProgress(part)));
          const mergedBlob = new Blob(buffers);
          const response = new Response(mergedBlob);
          await cache.put(cacheKey, response);
          return URL.createObjectURL(mergedBlob);
        }

        function getParts(file, start, end) {
          const parts = [];
          for (let i = start; i <= end; i++) {
            parts.push(file + ".part" + i);
          }
          return parts;
        }

        try {
          const datagzurl = await mergeFiles(getParts("Release/Build.datagz", 1, 2), "Build.datagz");

          const originalOpen = XMLHttpRequest.prototype.open;
          XMLHttpRequest.prototype.open = function (method, url, ...rest) {
            if (typeof url === "string" && url.indexOf("Build.datagz") !== -1) {
              url = datagzurl;
            }
            return originalOpen.call(this, method, url, ...rest);
          };

          const originalFetch = window.fetch;
          window.fetch = function (input, init) {
            if (typeof input === "string" && input.indexOf("Build.datagz") !== -1) {
              input = datagzurl;
            } else if (input && typeof input === "object" && input.url && input.url.indexOf("Build.datagz") !== -1) {
              input = new Request(datagzurl, input);
            }
            return originalFetch.call(this, input, init);
          };

          await new Promise((resolve, reject) => {
            const s = document.createElement("script");
            s.src = "Release/UnityLoader.js";
            s.onload = resolve;
            s.onerror = () => reject(new Error("Failed to load Release/UnityLoader.js"));
            document.body.appendChild(s);
          });

          const hideWhenReady = () => {
            if (loadingText && loadingText.parentNode) {
              document.getElementById("loading-ui").remove();
            }
          };
          setTimeout(hideWhenReady, 4000);
        } catch (err) {
          console.error(err);
          loadingText.textContent = "Unable to load game files"; document.getElementById("progress-detail").textContent = err.message;
          document.getElementById("progress-detail").style.color = "#ff6b6b";
        }
      })();
    </script>
  </body>
