<!DOCTYPE html>
<html>
<head>
    
<!-- Fullscreen is controlled by the GameHub player. -->

    <link rel="icon" type="image/x-icon" href="favicon.ico">
    
    
    <meta charset="UTF-8">
    <title>Fireboy & Watergirl 2: The Light Temple</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
        #player { width: 100%; height: 100%; }
    </style>
    <script src="ruffle.js"></script>










<style id="gamehub-touch-style">
  html, body, canvas, img, a, button, input, select, textarea, div {
    -webkit-tap-highlight-color: transparent !important;
    -webkit-touch-callout: none !important;
    -webkit-user-select: none !important;
    user-select: none !important;
  }
  *, *::before, *::after { -webkit-tap-highlight-color: transparent !important; }
  ::selection { background: transparent !important; color: inherit !important; }
  :focus, :focus-visible, canvas:active, canvas:focus { outline: none !important; box-shadow: none !important; }
</style>
</head>
<body>

    <div id="player"></div>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            document.getElementById("player").appendChild(player);
            
            player.style.width = "100%";
            player.style.height = "100%";
            
            player.load("FireboyandWatergirlinTheLightTemple.swf"); 
        });
    </script>

</body>
</html>
