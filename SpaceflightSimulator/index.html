<!DOCTYPE html>
<html lang="en-us">
  <head>
<script id="gamehub-mobile-fullscreen-first">(function(){'use strict';var mobile=window.matchMedia&&window.matchMedia('(max-width: 680px)').matches||/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);if(!mobile)return;function enter(){if(document.fullscreenElement)return;var root=document.documentElement,request=root.requestFullscreen||root.webkitRequestFullscreen||root.mozRequestFullScreen||root.msRequestFullScreen;if(request){try{var result=request.call(root,{navigationUI:'hide'});if(result&&result.catch)result.catch(function(){});}catch(e){}}}document.addEventListener('pointerdown',enter,{passive:true});document.addEventListener('touchstart',enter,{passive:true});})();</script>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Spaceflight Simulator</title>
    <link rel="icon" type="image/png" href="card.png">
    <link rel="apple-touch-icon" href="card.png">
    <link rel="stylesheet" href="TemplateData/style.css">
  <style id="gamehub-touch-style">html,body,body *{-webkit-tap-highlight-color:rgba(0,0,0,0)!important}html,body,canvas,img,a,button{ -webkit-user-select:none!important;user-select:none!important;outline:0!important}html,body{touch-action:manipulation}</style>
</head>
  <body>
    <style id="gamehub-loading-style">#gamehub-loading{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#000;color:#fff;font:700 15px Arial,sans-serif;text-align:center}#gamehub-loading .spinner{width:36px;height:36px;border:3px solid #333;border-top-color:#f0b400;border-radius:50%;animation:gamehub-spin .8s linear infinite}#gamehub-loading .detail{min-height:18px;color:#aaa;font-size:13px;font-weight:400}@keyframes gamehub-spin{to{transform:rotate(360deg)}}</style>
    <div id="gamehub-loading" role="status"><div class="spinner"></div><div id="loading-text">DOWNLOADING...</div><div id="loading-detail" class="detail">Preparing game files...</div></div>
    <div id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>

var loadingText = document.querySelector("#loading-text");
    var loadingDetail = document.querySelector("#loading-detail");
    let totalBytes = 0;
    let loadedBytes = 0;

    async function fetchWithProgress(url) {
      const response = await fetch(url, { cache: 'no-store' });
      if (!response.ok) throw new Error('Failed to load ' + url + ' (' + response.status + ')');
      if (!response.body || !response.body.getReader) throw new Error('Streaming is unavailable for ' + url);
      const reader = response.body.getReader();
      let chunks = [];
      let received = 0;
      while (true) {
        const {
          done,
          value
        } = await reader.read();
        if (done) break;
        received += value.length;
        loadedBytes += value.length;
        chunks.push(value);
        let mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
        let mbTotal = '87.82';
        loadingText.textContent = `DOWNLOADING... ${mbDone} MB / ${mbTotal} MB`;
        loadingDetail.textContent = 'Downloading game files';
      }
      let fullBuffer = new Uint8Array(received);
      let offset = 0;
      for (let chunk of chunks) {
        fullBuffer.set(chunk, offset);
        offset += chunk.length;
      }
      return fullBuffer.buffer;
    }

    async function mergeFiles(fileParts, cacheKey) {
      const cache = await caches.open("gash-cache");
      const cachedResponse = await cache.match(cacheKey);
      if (cachedResponse) {
        const blob = await cachedResponse.blob();
        return URL.createObjectURL(blob);
      }
      const buffers = await Promise.all(
        fileParts.map(part => fetchWithProgress(part))
      );
      const mimeType = cacheKey.indexOf('wasm') !== -1 ? 'application/wasm' : 'application/octet-stream';
      const mergedBlob = new Blob(buffers, { type: mimeType });
      const response = new Response(mergedBlob);
      await cache.put(cacheKey, response);
      return URL.createObjectURL(mergedBlob);
    }

    function getParts(file, start, end) {
      let parts = [];
      for (let i = start; i <= end; i++) {
        parts.push(file + ".part" + i);
      }
      return parts;
    }
    (async () => {
      const [dataUrl, wasmUrl] = await Promise.all([
        mergeFiles(getParts("Build/sfsim.data", 1, 3), "sfsim.data-v2"),
        mergeFiles(getParts("Build/sfsim.wasm", 1, 3), "sfsim.wasm-v2"),
      ]);
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {

      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/sfsim.loader.js";
      var config = {
        arguments: [],
        dataUrl: dataUrl,
        frameworkUrl: buildUrl + "/sfsim.framework.js",
        codeUrl: wasmUrl,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Stef Morojna",
        productName: "Spaceflight Simulator",
        productVersion: "1.6.00.16",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }


      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          document.querySelector('#gamehub-loading').style.display = 'none';
        }).catch((message) => {
          loadingText.textContent = "FAILED TO LOAD";
          loadingDetail.textContent = String(message);
          loadingDetail.style.color = "#ff7777";
        });
      };
      document.body.appendChild(script);
    })();
    </script>
    <style>
      #loading-text { z-index: 30 !important; pointer-events: none; }
      #unity-container { z-index: 1; }
    </style>
  </body>
</html>
