<!DOCTYPE html>

<head>
    
<!-- Fullscreen is controlled by the GameHub player. -->

    <link rel="icon" type="image/x-icon" href="favicon.ico">
    
    
	<meta charset="utf-8">
    <meta http-equiv="content-type" content="text/html; charset=UTF8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="#382C2A">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">


	<title>Bad Ice Cream</title>

	<script src="patch/js/poki-sdk.js?v=2"></script>
	<script type="text/javascript" src="./js/loader.js"></script>
	<script type="text/javascript" src="./js/virtualJoystickSkinMod.js"></script>
	<script type="text/javascript" src="./js/gamehub-mobile-controls.js"></script>
	<script type="text/javascript" src="./preloader/nitromePreloader.js"></script>
	<style>
		* {
			margin: 0;
			padding: 0;
		}

		canvas {
			outline: none
		}

		html,
		body,
		#container {
			margin: 0;
			overflow: hidden;
			width: 100%;
			height: 100%;
			background-color: #9badbe;
		}

		#splash {
			position: absolute;
			visibility: hidden;
			z-index: 10;
		}

		#splash__image {
			position: absolute;
			background-size: 72% auto;
			background-position: center;
			background-repeat: no-repeat;
			background-image: url("assets/badicecream_splash.jpg");
			visibility: visible;
			transition: opacity 0.5s;
			z-index: 10;
		}

		#progress__root {
			position: absolute;
		}

		@media (max-width: 700px) {
			#splash__image { background-size: 66% auto; }
		}

		#gamehub-mobile-controls { position: fixed; inset: 0; z-index: 1000; pointer-events: none; overflow: hidden; }
		.gamehub-controls-canvas { position: absolute; left: 50%; top: 50%; width: 1600px; height: 738px; transform: translate(-50%, -50%) scale(var(--gamehub-control-scale, 1)); transform-origin: center; pointer-events: none; }
		.gamehub-key { position: absolute; display: block; padding: 0; border: 0; background-color: transparent; background-position: center; background-repeat: no-repeat; background-size: contain; pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none; }
		.gamehub-key.pressed { filter: brightness(.68) drop-shadow(0 1px 1px rgba(0,0,0,.45)); transform: scale(.96); }
		.p1-action, .p2-action { top: 244px; width: 236px; height: 128px; }
		.p1-action { left: 41px; } .p2-action { right: 41px; }
		.p1-up, .p2-up { top: 395px; width: 109px; height: 115px; }
		.p1-up { left: 164px; } .p2-up { right: 204px; }
		.p1-left, .p1-down, .p1-right, .p2-left, .p2-down, .p2-right { top: 527px; width: 109px; height: 115px; }
		.p1-left { left: 41px; } .p1-down { left: 164px; } .p1-right { left: 287px; }
		.p2-left { right: 328px; } .p2-down { right: 205px; } .p2-right { right: 82px; }
		@media (orientation: landscape) { #gamehub-mobile-controls { --gamehub-control-scale: min(100vw / 1600, 100vh / 738); } }
		@media (orientation: portrait) { #gamehub-mobile-controls { --gamehub-control-scale: min(100vw / 1600, 100vh / 738); } }

		#progress__line {
			width: 0;
			height: 100%;
			transition: all 0.5s;
		}
	</style>
    










<style id="gamehub-touch-style">
  html, body, body * { -webkit-tap-highlight-color: rgba(0,0,0,0) !important; }
  html, body, canvas { -webkit-touch-callout: none !important; touch-action: manipulation; }
  html, body, canvas, img, a, button, iframe, [role="button"] { -webkit-user-select: none !important; user-select: none !important; }
  input, textarea, select, [contenteditable="true"] { -webkit-user-select: text !important; user-select: text !important; }
  *, *::before, *::after { outline: 0 !important; -webkit-focus-ring-color: transparent !important; }
  *:focus, *:focus-visible, canvas:active, canvas:focus { outline: 0 !important; box-shadow: none !important; }
  ::selection { background: transparent !important; color: inherit !important; }
</style>
</head>

<body>

	<div id="splash__image">
		<div id="progress__root">
			<div id="progress__line"></div>
		</div>
	</div>

	<script>

		window.addEventListener("load", () => {

			PokiSDK.setDebugTouchOverlayController(true);

			PokiSDK.init().then(
				() => {
					// successfully initialized
					onPokiInitComplete(false);
				}
			).catch(
				() => {
					// successfully initialized but the user has adblock
					onPokiInitComplete(true);
				}
			);
			let config;

config = {
    "key": "bic1",
    "title": "BadIceCream 1",
    "filename": "BadIceCream1_sdk",
    "pokiSDK": true,
    "debugPoki": false,
    "showFPS": false,
    "debug": false,
    "splash": "assets/badicecream_splash.jpg",
    "start": null,
    "width": 550,
    "height": 550,
    "x": 0,
    "y": 0,
    "w": "100%",
    "h": "100%",
    "stageScaleMode": null,
    "stageAlign": null,
    "progressParserWeigth": 1,
    "progress": {
        "direction": "lr",
        "back": "#35809e",
        "line": "#070bff",
        "rect": [
            0.25,
            0.65,
            0.5,
            0.03
        ]
    },
    "box2dVersion": "none",
    "skipFramesOfScene": null,
    "buttonPokiSDKActions": null,
    "retryButtonIDS": null,
    "retryButtonAction": null,
    "actionOnStop": null,
    "actionWhenRetryButtonEncountered": null,
    "binary": [
        {
            "name": "BadIceCream1_sdk",
            "path": "assets/BadIceCream1_sdk.swf",
            "size": 1937690,
            "resourceType": "GAME"
        }
    ],
    "runtime": "js/BadIceCream.js"
};

			PokiSDK.setDebug(config.debugPoki);

			Loader.init(config);

			let onPokiInitComplete = (adBlocked) => {

				PokiSDK.adBlocked = adBlocked;
				PokiSDK.gameLoadingStart();

				Loader.runGame((fill) => {
					PokiSDK.gameLoadingProgress({
						percentageDone: fill,
						kbLoaded: 0,
						kbTotal: 0,
						fileNameLoaded: "",
						filesLoaded: 0,
						filesTotal: 0
					});
					window.nitromePreloaderSetProgress(fill/1.0);
				}, (instance) => {
					PokiSDK.gameLoadingFinished();
					window.nitromePreloaderSetComplete();

				})

			}
			window.nitromePreloaderInit('bad-ice-cream');
		})
	</script>
<script id="gamehub-touch-behavior">
(() => {
  const clearTransientTouchState = () => {
    if (window.getSelection) window.getSelection().removeAllRanges();
    const active = document.activeElement;
    if (active && active !== document.body && !/^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)) active.blur();
  };
  document.addEventListener('pointerup', clearTransientTouchState, { capture: true, passive: true });
  document.addEventListener('touchend', clearTransientTouchState, { capture: true, passive: true });
})();
</script></body>

</html>
