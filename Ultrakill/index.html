<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | ULTRAKILL WEB PORT</title>
    <style>
      html, body { width: 100%; height: 100%; }
      #unity-canvas { display: block; margin: 0 auto; }
      #game-loading { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; color: #fff; background: #050505; font-family: Inter, system-ui, sans-serif; transition: opacity .25s ease; }
      #game-loading.is-hidden { opacity: 0; pointer-events: none; }
      .loading-card { display: grid; justify-items: center; gap: 14px; min-width: min(320px, 80vw); padding: 28px 30px; border: 1px solid rgba(255,255,255,.16); border-radius: 16px; background: rgba(20,20,20,.92); box-shadow: 0 18px 60px rgba(0,0,0,.5); }
      .loading-title { color: #f0472e; font-size: 1.15rem; font-weight: 900; letter-spacing: .14em; }
      .loading-spinner { width: 30px; height: 30px; border: 3px solid rgba(255,255,255,.2); border-top-color: #f0472e; border-radius: 50%; animation: spin .8s linear infinite; }
      .loading-track { width: 100%; height: 4px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.12); }
      .loading-pulse { width: 38%; height: 100%; border-radius: inherit; background: #f0472e; animation: pulse 1.25s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%, 100% { transform: translateX(-110%); } 50% { transform: translateX(270%); } }
    </style>
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0; background: #050505; overflow: hidden;">
    <div id="game-loading" role="status" aria-live="polite">
      <div class="loading-card">
        <div class="loading-title">ULTRAKILL</div>
        <div class="loading-spinner" aria-hidden="true"></div>
        <div id="loading-text">Loading game...</div>
        <div class="loading-track"><div class="loading-pulse"></div></div>
      </div>
    </div>
    <canvas id="unity-canvas" width="1280" height="720" tabindex="-1" style="width: 1280px; height: 720px; background: #231F20"></canvas>
    <script src="Build/build.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        var canvas = document.querySelector('#unity-canvas');
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        canvas.style.position = 'fixed';
        document.body.style.textAlign = 'left';
      }
      const loading = document.getElementById('game-loading');
      const loadingText = document.getElementById('loading-text');
      const notifyParent = (state, message) => {
        if (window.parent !== window) window.parent.postMessage({ gamehub: 'game-status', state, message: message || '' }, '*');
      };
      const config = {
        dataUrl: 'Build/build.data.unityweb',
        frameworkUrl: 'Build/build.framework.js.unityweb',
        codeUrl: 'Build/build.wasm.unityweb',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: 'Hakita and Cake Logic',
        productName: 'ULTRAKILL WEB PORT',
        productVersion: '1.4'
      };
      loadingText.textContent = 'Loading game files...';
      createUnityInstance(document.querySelector('#unity-canvas'), config)
        .then(function () {
          loadingText.textContent = 'Ready';
          notifyParent('ready');
          window.setTimeout(function () { loading.classList.add('is-hidden'); }, 250);
        })
        .catch(function (error) {
          loadingText.textContent = 'Unable to load game';
          notifyParent('error', 'Unable to load ULTRAKILL');
          console.error(error);
        });
    </script>
  </body>
</html>
